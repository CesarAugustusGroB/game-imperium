<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPERIUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow-x: hidden; overflow-y: auto; background: #0a0a14; }

      /* ── Battle Screen ── */
      #battle-screen {
        position: fixed; inset: 0;
        background: #0a0a14;
      }
      #battle-screen canvas { width: 100%; height: 100%; display: block; }
      #battle-hud {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 4px;
        font-family: 'Segoe UI', system-ui, sans-serif; pointer-events: none;
      }
      .battle-title {
        font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
        font-size: 18px; font-weight: 700; color: #f0d080;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0 16px rgba(240, 208, 128, 0.3);
        letter-spacing: 4px; text-transform: uppercase;
      }
      .battle-hint {
        font-size: 12px; color: rgba(200, 190, 160, 0.5); letter-spacing: 1px;
      }
      #btn-coords {
        position: fixed; bottom: 14px; right: 14px; z-index: 10;
        background: rgba(10, 10, 20, 0.75); border: 1px solid rgba(200, 180, 120, 0.3);
        color: rgba(200, 180, 120, 0.6); font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px; letter-spacing: 1px; padding: 6px 12px; border-radius: 4px;
        cursor: pointer; transition: all 0.2s ease;
      }
      #btn-coords:hover { background: rgba(20, 18, 36, 0.9); border-color: rgba(200, 180, 120, 0.6); color: #f0d080; }
      #btn-coords.active { border-color: #f0d080; color: #f0d080; background: rgba(240, 208, 128, 0.1); }

      /* Bottom battle bar — holds ability + decretum side by side */
      #battle-bottom-bar {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
        z-index: 10; display: flex; gap: 16px; align-items: flex-end;
        font-family: 'Segoe UI', system-ui, sans-serif;
        pointer-events: none;
      }
      /* Ability bar */
      #ability-bar {
        display: flex; gap: 8px; align-items: center;
        pointer-events: none;
      }
      #ability-bar .ability-btn {
        pointer-events: auto;
        background: linear-gradient(180deg, rgba(80, 60, 20, 0.7), rgba(50, 40, 18, 0.85));
        border: 1px solid rgba(220, 190, 100, 0.5);
        border-radius: 6px; padding: 8px 16px;
        color: rgba(240, 208, 128, 0.9);
        font-family: inherit; font-size: 12px;
        cursor: pointer; transition: all 0.2s ease;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        min-width: 120px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #ability-bar .ability-btn:hover:not(:disabled) {
        border-color: #f0d080;
        background: linear-gradient(180deg, rgba(110, 80, 25, 0.85), rgba(70, 55, 20, 0.95));
        color: #fff0c0;
        box-shadow: 0 0 12px rgba(240, 208, 128, 0.35), 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #ability-bar .ability-btn:active:not(:disabled) { transform: scale(0.97); }
      #ability-bar .ability-btn:disabled {
        opacity: 0.35; cursor: default;
        border-color: rgba(80, 80, 80, 0.2);
      }
      #ability-bar .ability-btn.targeting {
        border-color: #f0d080;
        background: rgba(240, 208, 128, 0.15);
        color: #f0d080;
        box-shadow: 0 0 12px rgba(240, 208, 128, 0.2);
      }
      #ability-bar .ability-name {
        font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
      }
      #ability-bar .ability-cost {
        font-size: 11px; opacity: 0.7;
      }
      #ability-bar .ability-hint {
        font-size: 10px; color: rgba(200, 190, 160, 0.4);
        letter-spacing: 0.5px; margin-top: 2px;
      }
      #decretum-bar {
        display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
        pointer-events: none;
      }
      #decretum-bar .decretum-btn {
        pointer-events: auto;
        background: linear-gradient(180deg, rgba(80, 60, 20, 0.7), rgba(50, 40, 18, 0.85));
        border: 1px solid rgba(220, 190, 100, 0.5);
        border-radius: 4px; padding: 6px 8px;
        color: rgba(240, 208, 128, 0.9);
        font-family: inherit; font-size: 9px;
        cursor: pointer; transition: all 0.2s ease;
        min-width: 0; width: 120px; text-align: center;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #decretum-bar .decretum-btn:hover:not(:disabled) {
        border-color: #f0d080;
        background: linear-gradient(180deg, rgba(110, 80, 25, 0.85), rgba(70, 55, 20, 0.95));
        color: #fff0c0;
        box-shadow: 0 0 10px rgba(240, 208, 128, 0.3), 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #decretum-bar .decretum-btn:disabled {
        opacity: 0.35; cursor: default;
      }
      #decretum-bar .decretum-btn.decretum-spoils {
        border-color: rgba(80, 80, 80, 0.3);
        opacity: 0.4;
      }
      @media (max-width: 600px) {
        #battle-bottom-bar { gap: 8px; }
        #ability-bar .ability-btn { min-width: 80px; padding: 6px 10px; font-size: 11px; }
        #decretum-bar { grid-template-columns: 1fr 1fr 1fr; }
        #decretum-bar .decretum-btn { width: auto; min-width: 60px; }
        .ability-btn, .decretum-btn { min-height: 44px; }
      }
    </style>
  </head>
  <body>
    <div id="app-root"></div>
    <div id="battle-screen">
      <canvas id="battle-canvas"></canvas>
      <div id="battle-hud">
        <span class="battle-title">Tactical Battle</span>
        <span class="battle-hint">Click unit to select &bull; Right-click to move &bull; ESC to restart</span>
      </div>
      <button id="btn-coords">COORDS</button>
      <div id="battle-bottom-bar">
        <div id="ability-bar"></div>
        <div id="decretum-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
